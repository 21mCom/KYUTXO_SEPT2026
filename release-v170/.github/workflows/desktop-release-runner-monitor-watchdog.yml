name: Watch desktop release runner monitor heartbeat

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: desktop-release-runner-monitor-watchdog
  cancel-in-progress: true

jobs:
  detect-missing-monitor-heartbeat:
    name: Detect missing hosted monitor completion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout watchdog
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Alert when the hosted monitor goes silent
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const watchdog = require('./.github/scripts/watch-release-runner-monitor.cjs');
            await watchdog.run({ github, context, core });