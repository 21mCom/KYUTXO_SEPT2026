name: Check release runner monitor live API contract

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: desktop-release-runner-monitor-live-contract
  cancel-in-progress: false

jobs:
  check-live-api-contract:
    name: Observe disposable readiness states
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout contract check
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Verify queued and follow-up states through GitHub
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const contract = require('./.github/scripts/check-release-runner-monitor-live-contract.cjs');
            await contract.runLiveContract({ github, context, core });