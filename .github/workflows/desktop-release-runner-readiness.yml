name: Check desktop release runner readiness

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-runner-readiness
  cancel-in-progress: false

jobs:
  check-runner:
    name: readiness-${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runner_label: desktop-release-win-x64
          - platform: darwin
            arch: x64
            runner_label: desktop-release-darwin-x64
          - platform: darwin
            arch: arm64
            runner_label: desktop-release-darwin-arm64
          - platform: linux
            arch: x64
            runner_label: desktop-release-linux-x64
          - platform: linux
            arch: arm64
            runner_label: desktop-release-linux-arm64
    runs-on:
      - self-hosted
      - "${{ matrix.runner_label }}"
    timeout-minutes: 10

    steps:
      - name: Checkout readiness probe
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Report host and verify non-destructive prerequisites
        shell: bash
        run: >-
          node scripts/check-release-runner-readiness.mjs
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}