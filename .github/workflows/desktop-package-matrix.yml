name: Verify desktop package matrix

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-native-boundary:
    timeout-minutes: 60
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
            builder_flag: --win
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify September repository destination
        run: node scripts/check-github-destination.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify target matrix and protected-claim gate
        shell: bash
        run: |
          node --test scripts/packaged-targets.test.mjs scripts/check-protected-vault-claims.test.mjs scripts/check-packaged-vault-lock-native.test.mjs
          node scripts/check-protected-vault-claims.mjs
          node scripts/check-packaged-freshness-guard.js

      - name: Build packaged renderer and native worker
        shell: bash
        run: |
          npx vite build --config vite.config.electron.ts
          node scripts/build-native-engine.mjs

      - name: Build target package
        shell: bash
        run: >-
          npx electron-builder
          --config electron-builder.json
          ${{ matrix.builder_flag }}
          --${{ matrix.arch }}
          --publish never

      - name: Verify packaged native module under shipping Electron ABI
        shell: bash
        env:
          KYUTXO_PACKAGED_SKIP_BUILD: '1'
        run: >-
          node scripts/check-packaged-native-engine.mjs
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --require-electron

      - name: Verify package filename and installed app version
        shell: bash
        run: >-
          node scripts/check-packaged-app-version.mjs
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: KYUTXO-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
          if-no-files-found: error