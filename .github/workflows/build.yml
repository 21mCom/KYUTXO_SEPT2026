name: Validate and build KYUTXO for Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release after the full suite and packaged checks pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify-desktop-package-matrix:
    uses: ./.github/workflows/desktop-package-matrix.yml

  build-windows:
    needs: verify-desktop-package-matrix
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/v') ||
      !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Pinned to windows-2022: the newer windows-latest (windows-2025) image is not
    # detected by the @electron/node-gyp fork's Visual Studio finder, breaking the
    # native better-sqlite3 compile during both `npm ci` and the Electron rebuild.
    #
    # Last reviewed: 2026-08-17. Both available PATs (GITHUB_PERSONAL_ACCESS_TOKEN
    # → 403 "Write access to repository not granted"; GITHUB_PERSONAL_ACCESS_TOKEN2
    # → invalid credentials) still lack push access to this repository. The
    # windows-2025 VS-finder regression is therefore NOT yet verified as resolved.
    # Keep this pin until a token with contents write access is configured, then:
    #   1. Change runs-on to windows-latest on a PR branch.
    #   2. If npm ci + electron-builder + check-packaged-native-engine.mjs all
    #      pass with no ABI mismatch or node-gyp errors → commit the change.
    #   3. If the VS finder still fails → restore this pin and update the date.
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check lockfile for internal Replit URLs
        run: node scripts/check-lockfile-urls.js

      - name: Install dependencies
        run: npm ci

      - name: Fail on high/critical npm audit findings
        run: node scripts/check-audit.js

      - name: Type-check
        run: npm run check

      - name: Run fast test tier
        run: npm run test:fast

      - name: Run full required suite for releases
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        run: npm run test:full

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bind release tag to the validated commit
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: bash
        run: |
          PACKAGE_VERSION="${{ steps.version.outputs.version }}"
          RELEASE_TAG="v$PACKAGE_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::Release tag $RELEASE_TAG must already exist"
            exit 1
          fi
          TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag $RELEASE_TAG points to $TAG_COMMIT, not validated commit $GITHUB_SHA"
            exit 1
          fi

      - name: Build application for Electron
        run: npx vite build --config vite.config.electron.ts

      - name: Build native read-engine worker bundle
        run: node scripts/build-native-engine.mjs

      - name: Build Electron app
        run: npx electron-builder --config electron-builder.json --win

      # RELEASE GATE: prove the native better-sqlite3 read-engine survives real
      # packaging on a full runner. npmRebuild is ON here, so the addon is built
      # for the Electron ABI — the check must run the extracted worker under the
      # packaged KYUTXO.exe itself (ELECTRON_RUN_AS_NODE), never a system-Node
      # stand-in. KYUTXO_NATIVE_ENGINE_REQUIRE_ELECTRON=1 disables the fallback
      # so an ABI/load regression fails the release instead of being masked.
      # Reuses the release/win-unpacked output from the electron-builder step.
      - name: Verify packaged native read-engine under shipping Electron ABI
        env:
          KYUTXO_PACKAGED_SKIP_BUILD: '1'
          KYUTXO_NATIVE_ENGINE_REQUIRE_ELECTRON: '1'
        run: node scripts/check-packaged-native-engine.mjs

      # RELEASE GATE: launch the exact generated Portable.exe release asset
      # from a disposable directory, create a vault, stop the full process
      # tree, relaunch the same wrapper, and drive both renderer sessions over
      # CDP. This catches wrapper/extraction regressions, portable data being
      # written to the runner profile, and packaged Electron blank windows.
      - name: Verify packaged Windows renderer and portable restart persistence
        env:
          KYUTXO_PACKAGED_SKIP_BUILD: '1'
        run: node scripts/check-packaged-electron-browser.mjs

      # RELEASE GATE: seed an oversized consolidation through the real
      # preload/main/native-worker path and prove all four Coin Passport windows
      # are independent, bounded, and tied to the displayed mirror checkpoint.
      - name: Verify oversized Coin Passport paging through packaged IPC
        env:
          KYUTXO_PACKAGED_SKIP_BUILD: '1'
        run: node scripts/check-packaged-coin-passport-browser.mjs

      # RELEASE GATE: the Coin Origins renderer must preserve separate
      # acquisition-lot and holding-row counts for the entire vault and wallet
      # scopes through the packaged native engine bridge.
      - name: Verify Coin Origins wallet-scoped counts through packaged IPC
        env:
          KYUTXO_PACKAGED_SKIP_BUILD: '1'
        run: node scripts/check-packaged-coin-origins-browser.mjs

      # RELEASE GATE: the exact packaged app must prove protected-store
      # migration, crash recovery, tamper rejection, password re-wrap, and
      # encrypted-backup recovery before the artifact can be uploaded.
      - name: Verify protected-vault migration recovery
        env:
          KYUTXO_PACKAGED_SKIP_BUILD: '1'
        run: node scripts/check-packaged-vault-migration.mjs

      # RELEASE GATE: the device-local network activity log must survive a
      # full Portable.exe process restart without persisting addresses/provider
      # URLs, and clearing it must leave the configured provider untouched.
      - name: Verify packaged network activity restart persistence
        env:
          KYUTXO_PACKAGED_SKIP_BUILD: '1'
        run: node scripts/check-packaged-network-privacy-activity-browser.mjs

      - name: Generate SHA-256 checksums
        run: npm run release:checksums

      - name: Upload executable and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: KYUTXO-${{ steps.version.outputs.version }}-Portable-${{ github.run_id }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.sha256

  publish-release:
    needs: build-windows
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: KYUTXO-*-Portable-${{ github.run_id }}
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.build-windows.outputs.version }}
        run: |
          mapfile -t EXES < <(find release-assets -maxdepth 1 -type f -name '*.exe' -print)
          mapfile -t SUMS < <(find release-assets -maxdepth 1 -type f -name '*.exe.sha256' -print)
          if [ "${#EXES[@]}" -eq 0 ] || [ "${#SUMS[@]}" -eq 0 ]; then
            echo "::error::Validated executable or SHA-256 sidecar is missing"
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${EXES[@]}" "${SUMS[@]}" \
            --verify-tag --generate-notes --title "KYUTXO $RELEASE_TAG"
