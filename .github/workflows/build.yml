name: Build KYUTXO for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    # Pinned to windows-2022: the newer windows-latest (windows-2025) image is not
    # detected by the @electron/node-gyp fork's Visual Studio finder, breaking the
    # native better-sqlite3 compile during both `npm ci` and the Electron rebuild.
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check lockfile for internal Replit URLs
        run: node scripts/check-lockfile-urls.js

      - name: Install dependencies
        run: npm ci

      - name: Fail on high/critical npm audit findings
        run: node scripts/check-audit.js

      - name: Set build version
        if: github.event_name == 'push'
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d. -f1,2)
          NEW_VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version >/dev/null
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Build version: $NEW_VERSION"

      - name: Read current version (PR builds)
        if: github.event_name != 'push'
        id: current_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build application for Electron
        run: npx vite build --config vite.config.electron.ts

      - name: Build native read-engine worker bundle
        run: node scripts/build-native-engine.mjs

      - name: Build Electron app
        run: npx electron-builder --config electron-builder.json --win

      # RELEASE GATE: prove the native better-sqlite3 read-engine survives real
      # packaging on a full runner. npmRebuild is ON here, so the addon is built
      # for the Electron ABI — the check must run the extracted worker under the
      # packaged KYUTXO.exe itself (ELECTRON_RUN_AS_NODE), never a system-Node
      # stand-in. KYUTXO_NATIVE_ENGINE_REQUIRE_ELECTRON=1 disables the fallback
      # so an ABI/load regression fails the release instead of being masked.
      # Reuses the release/win-unpacked output from the electron-builder step.
      - name: Verify packaged native read-engine under shipping Electron ABI
        env:
          KYUTXO_PACKAGED_SKIP_BUILD: '1'
          KYUTXO_NATIVE_ENGINE_REQUIRE_ELECTRON: '1'
        run: node scripts/check-packaged-native-engine.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KYUTXO-${{ steps.version.outputs.version || steps.current_version.outputs.version }}-Portable
          path: release/*.exe

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: KYUTXO v${{ steps.version.outputs.version }}
          files: release/*.exe
          generate_release_notes: true
