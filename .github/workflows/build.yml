name: Build KYUTXO for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check lockfile for internal Replit URLs
        run: node scripts/check-lockfile-urls.js

      - name: Install dependencies
        run: npm ci

      - name: Set build version
        if: github.event_name == 'push'
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d. -f1,2)
          NEW_VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version >/dev/null
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Build version: $NEW_VERSION"

      - name: Read current version (PR builds)
        if: github.event_name != 'push'
        id: current_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build application for Electron
        run: npx vite build --config vite.config.electron.ts

      - name: Build Electron app
        run: npx electron-builder --config electron-builder.json --win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KYUTXO-${{ steps.version.outputs.version || steps.current_version.outputs.version }}-Portable
          path: release/*.exe

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: KYUTXO v${{ steps.version.outputs.version }}
          files: release/*.exe
          generate_release_notes: true
